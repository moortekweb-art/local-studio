name: Dev checks

# dev is the working branch: many small commits, continuously green.
# This gate keeps commits micro — reviewable single-intent changes — so the
# weekly dev -> main PR is a readable changelog instead of a code dump.
#
# It runs on the pull request as well as the push, so an over-budget commit is
# caught before it lands instead of turning dev red afterwards. Squashing a
# multi-commit PR collapses it into a single commit the size of the whole
# branch, which busts the budget on any sizeable PR — that is why dev takes
# rebase merges. See docs/workflow.md.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  microcommits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce micro-commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          MAX_LINES=500
          # Lockfiles and generated snapshots don't count against the budget.
          EXCLUDES=':(exclude)**/bun.lock'
          EXCLUDES2=':(exclude)**/package-lock.json'
          EXCLUDES3=':(exclude)shared/model-recommendations.json'

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Every commit the PR would land, measured individually.
            RANGE="$BASE_SHA..$HEAD_SHA"
          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            RANGE="origin/main..$AFTER"
          else
            RANGE="$BEFORE..$AFTER"
          fi

          fail=0
          for sha in $(git rev-list --no-merges "$RANGE"); do
            subject=$(git log -1 --format=%s "$sha")
            lines=$(git show --numstat --format="" "$sha" -- . "$EXCLUDES" "$EXCLUDES2" "$EXCLUDES3" \
              | awk '{ add=$1; del=$2; if (add != "-") total+=add; if (del != "-") total+=del } END { print total+0 }')
            printf '%s %5d  %s\n' "$sha" "$lines" "$subject"
            if ! echo "$subject" | grep -qE '^(feat|fix|refactor|perf|docs|test|ci|build|chore|style|revert)(\(.+\))?!?: .+'; then
              echo "  ^ FAIL: subject must be a conventional commit"
              fail=1
            fi
            if [ "$lines" -gt "$MAX_LINES" ]; then
              echo "  ^ FAIL: $lines changed lines (max $MAX_LINES) — split this commit"
              fail=1
            fi
          done
          exit $fail
